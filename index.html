<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brujas | Editorial Gallery</title>
  
  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Cinematic -->
  <header class="hero">
    <!-- Reemplaza con tu fotografía más impactante de Brujas -->
    <div class="hero-bg" style="background-image: url('ruta-a-tu-foto-hero.jpg');"></div>
    <h1 class="hero-title">BRUJAS</h1>
    
    <div class="scroll-indicator">
      <span class="scroll-text">Descubrir</span>
      <div class="scroll-line"></div>
    </div>
  </header>

  <!-- Galería Estilo Museo -->
  <main class="gallery-container">
    
    <!-- Foto Grande -->
    <figure class="gallery-item size-large">
      <div class="image-wrapper">
        <img src="ruta-a-tu-foto-1.jpg" alt="Canales de Brujas">
      </div>
      <figcaption>Los canales del centro histórico, Flandes.</figcaption>
    </figure>

    <!-- Foto Pequeña Desfasada a la Derecha -->
    <figure class="gallery-item size-small offset-right">
      <div class="image-wrapper">
        <img src="ruta-a-tu-foto-2.jpg" alt="Arquitectura gótica">
      </div>
      <figcaption>Detalle arquitectónico, Plaza Burg.</figcaption>
    </figure>

    <!-- Foto Mediana Desfasada a la Izquierda -->
    <figure class="gallery-item size-medium offset-left">
      <div class="image-wrapper">
        <img src="ruta-a-tu-foto-3.jpg" alt="Cisne en el Minnewater">
      </div>
      <figcaption>El lago del amor (Minnewater).</figcaption>
    </figure>

    <!-- Añade más <figure> alternando las clases de tamaño y offset -->
    
  </main>

  <script src="script.js"></script>
</body>
</html>
