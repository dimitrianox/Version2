<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="theme-color" content="#070e17">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>Galería</title>
  
  <!-- Fuentes Google: Cinzel (Encabezados), Cormorant Garamond (Modal Título/Desc) y Manrope (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado Editorial estilo Póster -->
  <header class="main-header">
    <div class="divider-top">
<svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
  <path d="M12 2C11.5 4.5 9.8 7 8 8.2C6.2 9.4 4 9.8 4 12C4 13.8 5.4 15 7.2 14.6C8.8 14.2 9.8 13 10.5 11.5C10.4 12.8 10.2 13.8 9.5 14.8C9.2 15.2 8.5 15.6 8 16C7.5 16.4 7.2 17.2 7.6 17.8C8 18.4 8.8 18.5 9.4 18.1C10.2 17.6 11.2 17.8 12 18.5C12.8 17.8 13.8 17.6 14.6 18.1C15.2 18.5 16 18.4 16.4 17.8C16.8 17.2 16.5 16.4 16 16C15.5 15.6 14.8 15.2 14.5 14.8C13.8 13.8 13.6 12.8 13.5 11.5C14.2 13 15.2 14.2 16.8 14.6C18.6 15 20 13.8 20 12C20 9.8 17.8 9.4 16 8.2C14.2 7 12.5 4.5 12 2ZM8 14.5H16V16H8V14.5ZM12 19C11.2 19 10.5 20.2 10.5 21C10.5 21.8 11.2 22.5 12 22.5C12.8 22.5 13.5 21.8 13.5 21C13.5 20.2 12.8 19 12 19Z"/>
</svg>
    </div>
    
    <h1 id="titulo-pais" class="country-title"></h1>
    
    <div class="divider-year">
      <span id="titulo-anio" class="country-year"></span>
    </div>
  </header>

  <main id="galeria"></main>

  <!-- Adorno inferior estilo brújula -->
  <footer class="main-footer">
    <div class="divider-bottom">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
      </svg>
    </div>
  </footer>

  <!-- Modal -->
  <div class="modal">
    <div class="modal-content">
      <div class="editorial-header">
        <span id="info-ubicacion"></span>
        <span id="info-fecha"></span>
      </div>

      <div class="modal-media-wrapper">
        <img src="" alt="" id="modal-img" style="display: none;" referrerpolicy="no-referrer" />
        <video id="modal-video" controls style="display: none;" playsinline referrerpolicy="no-referrer"></video>
      </div>

      <div class="editorial-footer">
        <h3 id="info-titulo"></h3>
        <p id="info-descripcion"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
