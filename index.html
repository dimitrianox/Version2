<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="theme-color" content="#070e17">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>Galería</title>
  
  <!-- Fuentes Google: Cinzel (Encabezados), Cormorant Garamond (Modal Título/Desc) y Manrope (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado Editorial estilo Póster -->
  <header class="main-header">
    <div class="divider-top">
<svg class="header-icon" viewBox="0 0 24 24" fill="currentColor">
  <path d="M12 2C11.5 4 10.2 5.8 9 7C7.8 8.2 6 9.5 6 11.5C6 13.5 7.5 14.5 9 14C8.2 13 8 11.8 8.5 10.5C9.5 12 11 12.8 12 15C13 12.8 14.5 12 15.5 10.5C16 11.8 15.8 13 15 14C16.5 14.5 18 13.5 18 11.5C18 9.5 16.2 8.2 15 7C13.8 5.8 12.5 4 12 2ZM12 16.2C10.8 16.2 8.5 16.5 7 17.5C9 18.5 11 18.5 12 21C13 18.5 15 18.5 17 17.5C15.5 16.5 13.2 16.2 12 16.2Z"/>
</svg>
    </div>
    
    <h1 id="titulo-pais" class="country-title"></h1>
    
    <div class="divider-year">
      <span id="titulo-anio" class="country-year"></span>
    </div>
  </header>

  <main id="galeria"></main>

  <!-- Adorno inferior estilo brújula -->
  <footer class="main-footer">
    <div class="divider-bottom">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
      </svg>
    </div>
  </footer>

  <!-- Modal -->
  <div class="modal">
    <div class="modal-content">
      <div class="editorial-header">
        <span id="info-ubicacion"></span>
        <span id="info-fecha"></span>
      </div>

      <div class="modal-media-wrapper">
        <img src="" alt="" id="modal-img" style="display: none;" referrerpolicy="no-referrer" />
        <video id="modal-video" controls style="display: none;" playsinline referrerpolicy="no-referrer"></video>
      </div>

      <div class="editorial-footer">
        <h3 id="info-titulo"></h3>
        <p id="info-descripcion"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
