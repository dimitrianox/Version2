<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>Galería</title>
  
  <!-- Fuentes Google: Cinzel (Título Plata), Cormorant Garamond (Modal Título/Desc) y Manrope (Cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado simplificado con título centrado -->
  <header class="main-header">
    <h1 id="titulo-pais" class="country-title"></h1>
  </header>

  <main id="galeria"></main>

  <!-- Modal con contenedor central -->
  <div class="modal">
    <div class="modal-content">
      <div class="editorial-header">
        <span id="info-ubicacion"></span>
        <span id="info-fecha"></span>
      </div>

      <div class="modal-media-wrapper">
        <img src="" alt="" id="modal-img" style="display: none;" referrerpolicy="no-referrer" />
        <video id="modal-video" controls style="display: none;" playsinline referrerpolicy="no-referrer"></video>
      </div>

      <div class="editorial-footer">
        <h3 id="info-titulo"></h3>
        <p id="info-descripcion"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
